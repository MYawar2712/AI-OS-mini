working_days_per_week: 5
tickets_per_rep_per_day: { low: 35, base: 50, high: 65 }      # A-03
triage_minutes_per_ticket: { low: 2.0, base: 3.0, high: 5.0 } # A-04 (read, look up account, classify, route, summarise; excludes resolution)
misroute_rate: { low: 0.06, base: 0.12, high: 0.20 }          # A-05
rework_minutes_per_misroute: { low: 8, base: 15, high: 25 }   # A-06 (both teams: bounce, re-read, re-route)
