# Runtime settings. Secrets are NEVER stored here — see .env.example.
seed: 42
reference_date: "2026-11-11"   # "today" for synthetic data (renewal windows etc.) so runs are reproducible

paths:
  test_cases: eval/test_cases.jsonl
  results_dir: eval/results
  customers: data/synthetic/customers.json
  kb_articles: data/synthetic/kb_articles.json

llm:
  # Alibaba Cloud Model Studio (International / Singapore region), OpenAI-compatible endpoint (ADR-005, ADR-013).
  provider: dashscope
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  model: qwen3.8-27b   # selected by scripts.compare_models (ADR-016)
  max_tokens: 2048                # model spends some output tokens on hidden reasoning; leave headroom
  timeout_seconds: 60
  # Alternative provider (set provider: anthropic, api_key_env: ANTHROPIC_API_KEY, model: claude-haiku-5-5).

# USD per 1M tokens. Configurable; used by eval/metrics.py for cost-per-ticket.
# null = price not yet confirmed -> cost is reported as "n/a" rather than a made-up number.
# TODO(owner): copy qwen3.8-27b input/output prices from the Model Studio console.
pricing_usd_per_mtok:
  qwen3.8-27b: { input: null, output: null }
  deepseek-v4.1-flash-1017: { input: null, output: null }
  deepseek-v4.1-flash: { input: null, output: null }
  claude-haiku-5-5: { input: 0.10, output: 0.50 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  claude-opus-5-5: { input: 4.00, output: 20.00 }
  keyword_rules: { input: 0.0, output: 0.0 }

# Labour-cost assumptions for the pain/cost model (deliberately low — demo project, see A-07).
labour_cost_gbp_per_hour: { low: 12.0, base: 14.0, high: 17.0 }
